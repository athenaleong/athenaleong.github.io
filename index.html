<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--seo-head-->
    <script id="playground-boot">
      (() => {
        const html = document.documentElement;
        const restoreReadingView = () => {
          html.classList.remove('playground-booting');
          window.clearTimeout(timeout);
          window.removeEventListener('error', handleScriptError, true);
        };
        const handleScriptError = (event) => {
          if (event.target instanceof HTMLScriptElement) restoreReadingView();
        };
        // Run before the body can paint. Failed or blocked bundles still get
        // the readable HTML, and browsers without JavaScript never hide it.
        const timeout = window.setTimeout(restoreReadingView, 8000);
        document.addEventListener('playground-ready', restoreReadingView, { once: true });
        window.addEventListener('error', handleScriptError, true);
        html.classList.add('playground-booting');
      })();
    </script>
    <meta name="theme-color" content="#FFCB2F" />
    <link rel="icon" href="/slide-thick.png" />
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&family=Fira+Sans:wght@200;400;600&family=Hanken+Grotesk:wght@300;400;600&family=Livvic:wght@200;400;600&display=swap" rel="stylesheet" />
    <script>
      try {
        const theme = localStorage.getItem('theme');
        document.documentElement.classList.toggle('dark', theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches));
      } catch (_) {
        document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
      }
    </script>
  </head>
  <body>
    <!--playground-loading-->
    <div id="static-site"><!--static-content--></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
